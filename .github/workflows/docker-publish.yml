name: Build and publish Docker image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          IMAGE: ghcr.io/yeqingky/picsky
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use the vX.Y.Z format." >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            {
              echo "tags<<EOF"
              echo "$IMAGE:$GITHUB_REF_NAME"
              echo "$IMAGE:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            version="$short_sha"
            {
              echo "tags<<EOF"
              echo "$IMAGE:$short_sha"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              echo "push=true" >> "$GITHUB_OUTPUT"
            else
              echo "push=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.image.outputs.push }}
          tags: ${{ steps.image.outputs.tags }}
          build-args: VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
