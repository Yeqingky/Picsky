# Picsky 本地开发编排: 从当前源码构建镜像 + 随编排提供的 PostgreSQL (数据目录挂载到宿主机).
#
# 用法:
#   cp .env.example .env      # 至少填写 PICSKY_SECRET_KEY 与 POSTGRES_PASSWORD
#   mkdir -p data             # 应用容器以 uid 1000 运行, 需要可写 ./data
#   docker compose -f docker-compose-dev.yml up -d --build
#
# 与 docker-compose.yml 的差异:
#   - picsky 镜像来自本地构建 (Dockerfile), 不使用 ghcr.io 预构建镜像;
#   - 日志级别默认 debug; 构建参数 VERSION 默认 dev.
#
# 目录与权限: ./data -> /data (上传临时文件), ./data/postgres -> /var/lib/postgresql (镜像默认 PGDATA 位于其下;
# `_` 前缀使 Go 工具链忽略该目录, 仓库内 go build ./... / go test ./... 不受影响;
# 官方镜像以 root 启动时会自动创建并 chown 该目录, 无需手工处理).
#
# 纯本机开发 (不经过容器, 默认 SQLite) 的命令见 README 与 docs/tech-stack.md 第 6 节:
#   go run ./cmd/picsky          # 后端
#   cd web && npm run dev        # 前端 (代理 /api 与 /lsky 到 127.0.0.1:5214)

services:
  picsky:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${PICSKY_VERSION:-dev}
    image: picsky:dev
    container_name: picsky-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5214:5214"
    environment:
      PICSKY_SECRET_KEY: ${PICSKY_SECRET_KEY:?请在 .env 中设置 PICSKY_SECRET_KEY (32 字节 base64)}
      PICSKY_DB_DRIVER: ${PICSKY_DB_DRIVER:-postgres}
      PICSKY_DB_DSN: ${PICSKY_DB_DSN:-host=postgres port=5432 user=${POSTGRES_USER:-picsky} password=${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-picsky} sslmode=disable}
      PICSKY_LISTEN: 0.0.0.0:5214
      PICSKY_API_PREFIX: ${PICSKY_API_PREFIX:-/api/v1}
      PICSKY_LSKY_COMPAT_ENABLED: ${PICSKY_LSKY_COMPAT_ENABLED:-true}
      PICSKY_LSKY_COMPAT_PREFIX: ${PICSKY_LSKY_COMPAT_PREFIX:-/lsky}
      PICSKY_TEMP_DIR: /data/tmp
      PICSKY_UPLOAD_MEMORY_LIMIT: ${PICSKY_UPLOAD_MEMORY_LIMIT:-8388608}
      PICSKY_LOG_LEVEL: ${PICSKY_LOG_LEVEL:-debug}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5214/api/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:18-alpine
    container_name: picsky-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-picsky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-picsky}
      POSTGRES_DB: ${POSTGRES_DB:-picsky}
    volumes:
      - ./data/postgres:/var/lib/postgresql
      # docker run --rm postgres:18-alpine id postgres
      # mkdir -p ./data/postgres
      # chown 70:70 ./data/postgres && chmod 750 ./data/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-picsky} -d $${POSTGRES_DB:-picsky}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
